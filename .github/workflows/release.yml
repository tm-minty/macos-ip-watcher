name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build app + widget
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: ./scripts/package-adhoc.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IPWatch
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          body: |
            Menu bar app + Notification Center widget showing your external IP,
            country flag and VPN status.

            ### Downloads

            - `IPWatch.app.zip` — universal (Apple Silicon + Intel)
            - `IPWatch-arm64.app.zip` — Apple Silicon only
            - `IPWatch-amd64.app.zip` — Intel only

            ### Install (ad-hoc signed, not notarized)

            ```bash
            unzip IPWatch.app.zip
            xattr -dr com.apple.quarantine IPWatch.app
            open IPWatch.app
            ```

            If macOS blocks the launch: **System Settings → Privacy & Security → "Open Anyway"**.

            Requires macOS 13+ (the widget requires macOS 14+).
