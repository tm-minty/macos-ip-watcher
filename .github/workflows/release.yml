name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build app + widget
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodeproj
        run: sudo gem install xcodeproj --no-document

      - name: Generate Xcode project
        run: ruby scripts/generate-xcodeproj.rb

      - name: Build (ad-hoc signed)
        run: |
          xcodebuild -project IPWatch.xcodeproj -scheme IPWatch \
            -configuration Release -derivedDataPath .build/xcode \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" \
            PROVISIONING_PROFILE_SPECIFIER="" build

      - name: Package
        run: |
          mkdir -p dist
          ditto .build/xcode/Build/Products/Release/IPWatch.app dist/IPWatch.app
          ditto -c -k --sequesterRsrc --keepParent dist/IPWatch.app dist/IPWatch.app.zip
          shasum -a 256 dist/IPWatch.app.zip | tee dist/IPWatch.app.zip.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPWatch-app
          path: |
            dist/IPWatch.app.zip
            dist/IPWatch.app.zip.sha256
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/IPWatch.app.zip
            dist/IPWatch.app.zip.sha256
          body: |
            Menu bar app + Notification Center widget showing your external IP,
            country flag and VPN status.

            ### Install (ad-hoc signed, not notarized)

            ```bash
            unzip IPWatch.app.zip
            xattr -dr com.apple.quarantine IPWatch.app
            open IPWatch.app
            ```

            If macOS blocks the launch: **System Settings → Privacy & Security → "Open Anyway"**.

            Requires macOS 13+ (the widget requires macOS 14+).
